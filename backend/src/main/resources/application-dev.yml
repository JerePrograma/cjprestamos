spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cjprestamos}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

logging:
  level:
    org.hibernate.SQL: info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  legajo:
    adjuntos:
      directorio: ./storage/legajos
      tamano-maximo-bytes: 5242880
  auth:
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      role: ${BOOTSTRAP_ADMIN_ROLE:OPERADORA}

    integration-user:
      enabled: ${INTEGRATION_USER_ENABLED:false}
      username: ${INTEGRATION_USER_USERNAME:}
      password: ${INTEGRATION_USER_PASSWORD:}
      role: ${INTEGRATION_USER_ROLE:INTEGRATION}
